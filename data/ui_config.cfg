; UI switches read by UiArt (ui/ui_art.gd).
[cards]
; The UI art kit card frames (UI-FRAME-*, UI-RARITY-*, UI-STAT-PLAQUE, UI-COST-SOCKET) drawn over the card art.
; false = the original look: full-art card, thin Path-coloured border, name bar with cost, type line and rules text at the bottom.
; The frame images stay in assets/art/ui so a redesigned frame can be tried by setting this to true. Card backs are not affected.
use_card_frame_overlays=false
