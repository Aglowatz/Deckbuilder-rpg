; UI switches read by UiArt (ui/ui_art.gd).
[cards]
; The UI art kit card frames (UI-FRAME-*, UI-RARITY-*, UI-STAT-PLAQUE, UI-COST-SOCKET) drawn over the card art.
; false = the original look: full-art card, thin Path-coloured border, name bar with cost, type line and rules text at the bottom.
; The frame images stay in assets/art/ui so a redesigned frame can be tried by setting this to true. Card backs are not affected.
use_card_frame_overlays=false

[character]
; The Character screen's equipment slots (CharacterLayout, ui/town/character_layout.gd). true = UI-BG-CHARACTER is the first background with eight
; painted frames: the five slots sit on five of them and the three spare frames are covered. false = a background without painted frames: the game
; draws its own five slot frames on the figure's head, chest, hands and feet. `bash tools/import_ui_art.sh` sets this by itself when it imports a
; new UI-BG-CHARACTER. Optional, for a redone figure in another place: slot_centers={"helm": [691, 146], "armor": [691, 336], "weapon": [487, 532], "relic": [893, 532], "boots": [694, 902]}
; (screen units of 1920x1080; weapon = the figure's right hand on the screen left, relic = its left hand on the screen right).
background_painted_slots=true
