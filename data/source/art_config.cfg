; Card art source (docs/art/art_pipeline.md). Read-only: the importer only COPIES (converted to WebP) from here and never moves,
; renames or deletes anything. Override per run with the ART_SOURCE_DIR environment variable. Never point this at the
; "Pending Review" or "Superseded" folders; the importer refuses them.
[art]
source_dir="G:/My Drive/Card Game Art/Approved"
; Battleboard art source (docs/art/art_pipeline.md, "import battleboards"). Same read-only rule. Override with BATTLEBOARD_SOURCE_DIR.
battleboard_dir="G:/My Drive/Card Game Art/Approved_Battleboards"
; NPC dialogue portrait source (docs/art/art_pipeline.md, "import portraits"). Same read-only rule: only COPIES (to WebP, 768 px tall); nothing here is moved, renamed or deleted.
; Files are named by Portrait Image ID (NPC-ELDER.png) with optional expressions (NPC-ELDER_HAPPY.png). Override with PORTRAIT_SOURCE_DIR.
portrait_dir="G:/My Drive/Card Game Art/Approved_Characters"
; Dungeon map source (docs/art/art_pipeline.md, "import maps"). Same read-only rule: only COPIES (to WebP, 3:2, never cropped); nothing here is moved, renamed or deleted.
; Files are named by Map Image ID (MAP-HOG.png). Override with MAP_SOURCE_DIR.
map_dir="G:/My Drive/Card Game Art/Approved_Maps"
; UI art kit source (docs/art/art_pipeline.md, "import UI art"). Same read-only rule: only COPIES (to WebP, trimmed/scaled); nothing here is moved, renamed or deleted.
; Files are named by UI ID (UI-FRAME-B.png). Override with UI_SOURCE_DIR.
ui_dir="G:/My Drive/Card Game Art/Approved_UI"
; Painted texture/decal source (docs/art/style_guide.md, "import textures"). Same read-only rule: only COPIES (seamless albedo + normal/roughness pack, decals with alpha); nothing here is moved, renamed or deleted.
; Files are named by ID (TEX-MAT-ROCK.png, DEC-MOSS.png) listed in data/source/textures.csv. Override with TEXTURE_SOURCE_DIR.
texture_dir="G:/My Drive/Card Game Art/Approved_Textures"
; Vendor screen backgrounds (docs/art/art_pipeline.md, "import key art"). Same read-only rule: only COPIES (to WebP, cropped to 16:9); nothing here is moved, renamed or deleted.
; Files are named by Vendor Screen ID (VS-SABLE.png) listed in the VENDOR SCREENS section of data/source/npc_list.csv. Override with VENDOR_SOURCE_DIR.
vendor_dir="G:/My Drive/Card Game Art/Approved_VendorScreens"
; Key art source (logo, app icon, title screen, loading screens, zone title cards, story stills; STEAM-* and ITCH-COVER are store art and are never imported). Same read-only rule.
; Files are named by ID (LOGO-WORDMARK.png) listed in data/source/logo_title_art.csv. Override with KEYART_SOURCE_DIR.
keyart_dir="G:/My Drive/Card Game Art/Approved_KeyArt"
; Icon set source (docs/art/art_pipeline.md, "import icons"). Same read-only rule: only COPIES (trimmed, squared, 256 px master + 24/32/48/64/96/128 px crisp variants, lossless WebP); nothing here is moved, renamed or deleted.
; Files are named by Icon ID (ICON-KW-FLYING.png) listed in data/source/icons.csv. Override with ICON_SOURCE_DIR.
icons_dir="G:/My Drive/Card Game Art/Approved_Icons"
; Cosmetics source (docs/art/world_rollout.md, "import cosmetics"). Same read-only rule: only COPIES; nothing here is moved, renamed or deleted.
; Hats are COS-HAT-<NAME>-<FRONT|FRONTSIDE|SIDE|BACKSIDE|BACK>.png, cloaks are whole sprite sets SPR-PLAYER-CLOAK-<NAME>-<DIR>_<IDLE|WALK>.png. Looked for in this folder
; and in the world-test folder. Override with COSMETICS_SOURCE_DIR.
cosmetics_dir="G:/My Drive/Card Game Art/Approved_Cosmetics"
worldtest_dir="G:/My Drive/Card Game Art/Approved_WorldTest"
; Music and sting source (docs/audio/music_integration.md, "import audio"). Same read-only rule: only COPIES to assets/audio/music (loops, story cues) and
; assets/audio/stings; nothing here is moved, renamed or deleted. Files are named by ID from data/source/music_list.csv (MUS-TITLE.ogg loops, STG-VICTORY.wav stings).
; A loop that only has a WAV master is converted to OGG with ffmpeg (ffmpeg_path, or the FFMPEG env var). Override the folder with AUDIO_SOURCE_DIR.
audio_dir="G:/My Drive/Card Game Art/Approved_Audio"
ffmpeg_path=""
